<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Card</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .textCenterAlign {
            text-align: center;
        }
        
        .imageCard {
            width: 320px;
            height: 400px;
            margin: 40px auto;
            border-radius: 5px;
            box-shadow: 1px 1px 5px 5px rgb(49, 210, 247);
            position: relative;
        }

        .imageCard>img {
            width: 100%;
            height: 350px;
            border-radius: 5px;
        }

        .description {
            font-size: 18px;
            width: 100%;
            line-height: 50px;
            font-weight: 600;
            text-align: center;
            text-transform: capitalize;
        }

        .loader {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgb(49, 210, 247);
            color: rgb(1, 56, 74);
            font-size: 20px;
        }

        .active {
            display: flex;
        }

        .controls {
            margin: 20px auto;
            width: fit-content;
        }

        button {
            border-radius: 5px;
            border: 1px solid;
            cursor: pointer;
            width: 120px;
            height: 40px;
            text-transform: capitalize;
            transition: all 0.4s ease-in-out;
        }

        button:hover {
            background: black;
            color: white;
        }

        button:nth-child(1) {
            margin-right: 20px;
        }
    </style>
</head>

<body>
    <h1 class="textCenterAlign">Image Album</h1>
    <figure class="imageCard">
        <img src="https://images.unsplash.com/photo-1526034332220-067b0f400e06?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8dGlnZXJ8ZW58MHx8MHx8fDA%3D"
            alt="photo" id="image" loading="lazy" />
        <figcaption class="description">Tiger</figcaption>
        <div class="loader">
            Loading...
        </div>
    </figure>

    <div class="controls">
        <button onclick="previousImageCard()">prev</button>
        <button onclick="nextImageCard()">next</button>
    </div>
    <script>
        const images = [
            {
                src: 'https://images.unsplash.com/photo-1526034332220-067b0f400e06?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8dGlnZXJ8ZW58MHx8MHx8fDA%3D',
                name: 'tiger',
            },
            {
                src: 'https://images.unsplash.com/photo-1516642499105-492ff3ac521b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bGlvbnxlbnwwfHwwfHx8MA%3D%3D',
                name: 'lion',
            },
            {
                src: 'https://images.unsplash.com/photo-1476922027627-aa7293e3aaa8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZGVlcnxlbnwwfHwwfHx8MA%3D%3D',
                name: 'deer',
            },
            {
                src: 'https://images.unsplash.com/photo-1648402279767-cf3e3721508e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fG1vbmtleXxlbnwwfHwwfHx8MA%3D%3D',
                name: 'monkey',
            }
        ]

        let currentIndex = 0;
        let totalImages = images.length

        // navigate to previous image in cyclic order
        function previousImageCard() {
            const modifiedIndex = (currentIndex + 1) % (totalImages)
            currentIndex = modifiedIndex;
            loading()
            changeImageCard()
            setTimeout(() => {
                loading()
            }, 1000);
        }

        // navigate to next image in cyclic order
        function nextImageCard() {
            const modifiedIndex = (totalImages + (currentIndex - 1)) % (totalImages)
            currentIndex = modifiedIndex;
            changeImageCard()
            loading()
            setTimeout(() => {
                loading()
            }, 1000);
        }

        // change the data of imageCard
        function changeImageCard() {
            const img = document.querySelector('#image')
            const name = document.querySelector('.description')
            img.src = images[currentIndex].src;
            name.textContent = images[currentIndex].name;
        }

        // apply loader or remove loader
        function loading() {
            const loader = document.querySelector('.loader')
            loader.classList.toggle('active')
        }
    </script>
</body>

</html>
